name: daily-update

# その日のレートは毎日 UTC 4〜5 時台に出る。15:30（日本時間）に取り、翌朝 7:00 にもう一度取り直す。
on:
  schedule:
    - cron: '30 6 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'updater/**', '.github/workflows/daily.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 点検のテスト
        run: python updater/test_quality.py
      - name: 取得して作り直す
        run: python updater/update.py
      - name: 履歴を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
